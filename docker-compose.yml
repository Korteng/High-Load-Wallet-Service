services:
  wallet-postgres:
    image: postgres:15
    container_name: wallet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wallet_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wallet_pass}
      POSTGRES_DB: wallet_db
    volumes:
      - wallet_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet_user -d wallet_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: ["postgres", "-c", "max_connections=50"]

  wallet-app:
    build: .
    container_name: wallet-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://wallet-postgres:5432/wallet_db
      SPRING_DATASOURCE_USERNAME: wallet_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-wallet_pass}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_LIQUIBASE_ENABLED: "true"
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_MODEL: ${LLM_MODEL:-GigaChat-2}
      GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY:-}
    depends_on:
      wallet-postgres:
        condition: service_healthy

volumes:
  wallet_data: