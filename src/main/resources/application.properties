spring.application.name=wallet

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://wallet-db:5432/wallet}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
server.tomcat.threads.max=300

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.liquibase.change-log=classpath:db/changelog-master.yaml
spring.liquibase.enabled=true

telegram.enabled=${TELEGRAM_ENABLED:false}
telegram.token=${TELEGRAM_TOKEN:}
telegram.poll-timeout-seconds=${TELEGRAM_POLL_TIMEOUT:25}
telegram.allowed-chat-ids=${TELEGRAM_ALLOWED_CHAT_IDS:}

llm.enabled=${LLM_ENABLED:false}
llm.model=${LLM_MODEL:GigaChat-2}
llm.base-url=${LLM_BASE_URL:https://api.giga.chat}
gigachat.auth-key=${GIGACHAT_AUTH_KEY:}
gigachat.scope=${GIGACHAT_SCOPE:GIGACHAT_API_PERS}
gigachat.oauth-url=${GIGACHAT_OAUTH_URL:https://ngw.devices.sberbank.ru:9443/api/v2/oauth}
telegram.worker-threads=${TELEGRAM_WORKER_THREADS:8}
